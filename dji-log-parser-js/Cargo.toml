[package]
name = "dji-log-parser-js"
version.workspace = true
description = "Javascript bindings for dji-log-parser rust library"
categories.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# native-async makes the crate build on native targets too (cargo build/clippy --workspace)
dji-log-parser = { workspace = true, features = ["native-async"] }
js-sys.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
