[workspace]
resolver = "2"
members = ["dji-log-parser", "dji-log-cli", "dji-log-parser-js"]

[workspace.package]
authors = ["Luc Vauvillier <luc.vauvillier@gmail.com>"]
edition = "2021"
version = "0.5.7"
repository = "https://github.com/lvauvillier/dji-log-parser"
license = "MIT"
keywords = ["dji", "UAV", "parser", "drones"]
categories = [
    "aerospace::drones",
    "aerospace::protocols",
    "parser-implementations",
    "parsing",
]

[workspace.dependencies]
dji-log-parser = { path = "dji-log-parser" }
aes = "0.9.4"
async-channel = "2.5"
base64 = "0.23"
binrw = "0.15"
cbc = "0.2.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crc64 = "2.0.0"
csv = "1.4"
geojson = "1.0"
img-parts = "0.4"
insta = "1.49"
js-sys = "0.3.107"
kamadak-exif = "0.6"
kml = "0.15"
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0"
ureq = { version = "3.5", features = ["json"] }
zip = { version = "9.8", default-features = false }
serde-wasm-bindgen = "0.6"
tsify-next = "0.5.6"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
